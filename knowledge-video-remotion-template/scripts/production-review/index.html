<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>局部修改对照</title><style>/*STYLE*/</style><main>
<h1>局部修改对照</h1><p id="description"></p><video id="video" controls playsinline preload="metadata"></video>
<p id="clock" aria-live="polite"></p><div class="controls"><button id="before">改前</button><button id="after">改后</button><button id="play">播放 / 暂停</button><button id="previous">上一帧</button><button id="next">下一帧</button><button id="loop" aria-pressed="false">范围循环：关</button></div>
<div class="controls"><label>整条时间 <input id="seek" type="range" step="0.001"></label><label>速度 <select id="speed"><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="1.5">1.5×</option></select></label><label>音轨 <select id="track"><option value="mix">完整混音</option><option value="music">只听配乐</option><option value="effects">只听音效</option></select></label></div>
<p id="status" role="status"></p><details><summary>检查记录</summary><p>播放和技术检查不自动代表观看、试听或认可。</p><label><input id="viewed" type="checkbox">我已实际查看这一范围</label> <label><input id="listened" type="checkbox">我已实际试听这一范围</label><p><textarea id="note" rows="3" placeholder="记录具体位置和问题"></textarea></p><button id="download">下载检查记录</button></details>
</main><script>/*DATA*/
/*CLIENT*/</script></html>
