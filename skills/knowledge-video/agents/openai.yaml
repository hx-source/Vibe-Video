interface:
  display_name: "知识视频制作"
  short_description: "围绕内容制作知识动画，复用模板工程，安排配乐音效并完成验证交付"
  default_prompt: "请用 $knowledge-video 和 Remotion 模板工程根据本期主题制作知识视频，分镜前检查核心问题、内容递进、视觉重点和关键变化；新主题用同内容三种实际视觉示例和十秒有声样片验证，已有规格与风格直接沿用。要求音乐卡点时先固定音乐并分析校正节拍，再按反馈分段制作。局部修改检查影响范围，已启用项目通过production统一入口记录当前版本、修订、对照与反馈，保留已认可内容和历史产物，不增加重复确认。"
