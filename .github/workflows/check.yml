name: Source and configuration checks
on: [push, pull_request]
jobs:
  check:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: video-remotion-template
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: video-remotion-template/package-lock.json
      - run: npm ci
      - run: npm run demo:assets
      - run: npm run check:scaffold
      - run: npm run typecheck
      - run: npm test
